<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Teacher Assistant</title>
<style>
  :root {
    --bg:#e9edf3; --surface:#ffffff; --surface-2:#f4f6f9; --text:#1a1f2b; --text-dim:#586074;
    --border:#d7dce6; --border-strong:#c2cad8;
    --accent:#2563d9; --accent-ink:#ffffff; --accent-soft:#e8f0ff;
    --owes:#b56a00; --owes-bg:#fff4e0; --owes-line:#e7a63a;
    --logged:#137a41; --logged-bg:#e6f5ec;
    --nodata:#5f6675; --nodata-bg:#eceef2;
    --mastery:#8a6300; --mastery-bg:#fbf1d4;
    --pending:#6a35c9; --pending-bg:#efe7fb;
    --danger:#b5271b;
    --shadow:0 6px 24px rgba(24,33,52,.14);
    --radius:16px;
    /* student identity hues — fixed per student, deliberately NOT green/amber/red (those are status) */
    --s-ab:#0f766e; --s-cd:#4338ca; --s-ef:#0369a1; --s-gh:#6d28d9; --s-jm:#a21caf; --s-rt:#0e7490;
    /* PLAN day-type hues — separate semantic domain from TRACK status colors; applied to TEXT + BORDER only */
    --plan-core:#2563d9; --plan-sdi:#0f8a4f; --plan-rev:#7c3aed;
  }
  :root[data-theme="dark"] {
    --bg:#0e1320; --surface:#182234; --surface-2:#1f2b40; --text:#e9eef6; --text-dim:#9aa7bd;
    --border:#2c3a52; --border-strong:#3a4a66;
    --accent:#5f9dff; --accent-ink:#0a1120; --accent-soft:#1b2740;
    --owes:#f0b552; --owes-bg:#3a2c12; --owes-line:#f0b552;
    --logged:#54d38c; --logged-bg:#123726;
    --nodata:#9aa7bd; --nodata-bg:#232c3b;
    --mastery:#f4d271; --mastery-bg:#3a3111;
    --pending:#bda2f7; --pending-bg:#2a1f45;
    --danger:#ff8072;
    --shadow:0 6px 26px rgba(0,0,0,.45);
    --s-ab:#2dd4bf; --s-cd:#818cf8; --s-ef:#38bdf8; --s-gh:#a78bfa; --s-jm:#e879f9; --s-rt:#22d3ee;
    --plan-core:#6ea8ff; --plan-sdi:#3ad486; --plan-rev:#b98cff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e1320; --surface:#182234; --surface-2:#1f2b40; --text:#e9eef6; --text-dim:#9aa7bd;
      --border:#2c3a52; --border-strong:#3a4a66;
      --accent:#5f9dff; --accent-ink:#0a1120; --accent-soft:#1b2740;
      --owes:#f0b552; --owes-bg:#3a2c12; --owes-line:#f0b552;
      --logged:#54d38c; --logged-bg:#123726;
      --nodata:#9aa7bd; --nodata-bg:#232c3b;
      --mastery:#f4d271; --mastery-bg:#3a3111;
      --pending:#bda2f7; --pending-bg:#2a1f45;
      --danger:#ff8072;
      --shadow:0 6px 26px rgba(0,0,0,.45);
      --s-ab:#2dd4bf; --s-cd:#818cf8; --s-ef:#38bdf8; --s-gh:#a78bfa; --s-jm:#e879f9; --s-rt:#22d3ee;
      --plan-core:#6ea8ff; --plan-sdi:#3ad486; --plan-rev:#b98cff;
    }
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.4; padding:1.2rem 0.6rem 2rem;
    display:flex; justify-content:center; align-items:flex-start;
  }

  .phone {
    width:100%; max-width:26rem; background:var(--bg);
    border:1px solid var(--border-strong); border-radius:30px; overflow:hidden;
    box-shadow:var(--shadow); position:relative;
    height:52rem; max-height:90vh; display:flex; flex-direction:column;
  }

  /* frame chrome */
  .statusbar {
    display:flex; align-items:center; gap:.5rem; padding:.55rem .9rem;
    background:var(--surface); border-bottom:1px solid var(--border); font-size:.8rem;
  }
  .statusbar .grow { flex:1; }
  .offline {
    display:inline-flex; align-items:center; gap:.35rem; font-weight:600; color:var(--owes);
    background:var(--owes-bg); padding:.2rem .5rem; border-radius:999px; font-size:.72rem;
  }
  .iconbtn {
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:10px; padding:.3rem .5rem; font-size:.85rem; cursor:pointer;
  }
  .roleseg { display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .roleseg button { border:0; background:var(--surface-2); color:var(--text-dim); padding:.3rem .55rem; font-size:.72rem; cursor:pointer; font-weight:600; }
  .roleseg button.on { background:var(--accent); color:var(--accent-ink); }

  .screen { flex:1; overflow-y:auto; overflow-x:hidden; padding:.9rem .9rem 1rem; }
  .screen::-webkit-scrollbar { width:0; }

  /* bottom nav */
  .tabbar { display:flex; background:var(--surface); border-top:1px solid var(--border); }
  .tabbar button {
    flex:1; border:0; background:transparent; color:var(--text-dim); padding:.6rem 0 .7rem;
    font-size:.72rem; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.15rem;
  }
  .tabbar button .ic { font-size:1.15rem; line-height:1; }
  .tabbar button.on { color:var(--accent); }

  h1 { font-size:1.15rem; margin:.1rem 0 .1rem; }
  h2 { font-size:1rem; margin:1rem 0 .5rem; }
  .sub { color:var(--text-dim); font-size:.82rem; margin:.1rem 0 .7rem; }
  .backrow { display:flex; align-items:center; gap:.4rem; margin-bottom:.3rem; }
  .back { border:0; background:transparent; color:var(--accent); font-weight:700; font-size:.9rem; cursor:pointer; padding:.2rem 0; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.85rem; margin-bottom:.7rem; }
  .card.tight { padding:.6rem .7rem; }

  /* three-state header */
  .headline { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.9rem; margin-bottom:.8rem; }
  .weeknav { display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem; }
  .weeknav .wk { font-weight:700; font-size:.95rem; }
  .weeknav button { border:0; background:transparent; color:var(--accent); font-size:1.1rem; cursor:pointer; padding:.1rem .4rem; }
  .three { display:flex; gap:.4rem; margin:.3rem 0 .55rem; flex-wrap:wrap; }
  .stat { flex:1; min-width:5rem; border-radius:12px; padding:.5rem .55rem; text-align:center; }
  .stat b { display:block; font-size:1.35rem; line-height:1.1; }
  .stat span { font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; font-weight:700; opacity:.9; }
  .stat.scored { background:var(--logged-bg); color:var(--logged); }
  .stat.excused { background:var(--nodata-bg); color:var(--nodata); }
  .stat.owe { background:var(--owes-bg); color:var(--owes); }
  .pendnote { font-size:.76rem; color:var(--pending); background:var(--pending-bg); border-radius:8px; padding:.3rem .5rem; margin-top:.25rem; display:inline-block; margin-right:.3rem; }

  .grouplabel { display:flex; align-items:center; gap:.4rem; margin:.7rem .1rem .35rem; }
  .grouplabel .ln { flex:1; height:1px; background:var(--border); }
  .grouplabel span { font-size:.72rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim); }
  .grouplabel.owes span { color:var(--owes); }

  /* goal row */
  .row {
    display:flex; align-items:center; gap:.6rem; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:.7rem .75rem; margin-bottom:.5rem; color:var(--text);
  }
  .row.owes { border-color:var(--owes-line); background:var(--owes-bg); }
  .chip { font-size:1.35rem; width:1.6rem; text-align:center; flex:none; }
  .chip.owes{color:var(--owes);} .chip.logged{color:var(--logged);} .chip.nodata{color:var(--nodata);}
  .chip.mastery{color:var(--mastery);} .chip.pending{color:var(--pending);}
  .rowmain { flex:1; min-width:0; }
  .rowtitle { display:block; font-weight:700; font-size:.95rem; }
  .rowmeta { display:block; font-size:.78rem; color:var(--text-dim); margin-top:.1rem; }
  .rowright { text-align:right; flex:none; }
  .rowval { font-weight:800; font-size:1rem; }
  .rowval.dim { color:var(--text-dim); font-weight:600; font-size:.8rem; }
  .sync { font-size:.66rem; color:var(--accent); font-weight:700; display:inline-flex; align-items:center; gap:.2rem; }
  .goalname { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }

  /* student avatar — solid color monogram, fixed identity per student (LOCKED 2026-08-30) */
  .av { flex:none; display:inline-flex; align-items:center; justify-content:center; font-weight:800; letter-spacing:.01em; font-size:.82rem; }
  .av.circle { width:2.3rem; height:2.3rem; border-radius:50%; color:#fff; }
  .av.sm { width:1.5rem; height:1.5rem; font-size:.62rem; border-radius:50%; color:#fff; vertical-align:middle; }
  .av.ab{background:var(--s-ab);} .av.cd{background:var(--s-cd);} .av.ef{background:var(--s-ef);}
  .av.gh{background:var(--s-gh);} .av.jm{background:var(--s-jm);} .av.rt{background:var(--s-rt);}
  .period { display:inline-block; font-size:.64rem; font-weight:800; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.03rem .3rem; margin-left:.35rem; vertical-align:middle; }

  /* by-student grouping card */
  .scard { border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:.6rem; background:var(--surface); }
  .shead { display:flex; align-items:center; gap:.6rem; padding:.55rem .7rem; background:var(--surface-2); }
  .shead .name { font-weight:800; font-size:.92rem; }
  .sgoal { display:flex; align-items:center; gap:.55rem; width:100%; text-align:left; font-family:inherit;
    font-size:.86rem; color:var(--text); background:transparent; border-top:1px solid var(--border); padding:.55rem .7rem; }
  .sgoal .g { flex:1; min-width:0; font-weight:600; }
  .sgoal .chip { font-size:1.1rem; width:1.3rem; }
  .rail { width:.28rem; border-radius:2px; align-self:stretch; flex:none; }
  .rail.ab{background:var(--s-ab);} .rail.cd{background:var(--s-cd);} .rail.ef{background:var(--s-ef);}
  .rail.gh{background:var(--s-gh);} .rail.jm{background:var(--s-jm);} .rail.rt{background:var(--s-rt);}

  /* validate variant */
  .validate { border-color:var(--pending); background:var(--pending-bg); }
  .valbtns { display:flex; gap:.4rem; margin-top:.55rem; }
  .valbtns button { flex:1; }

  /* buttons */
  .btnrow { display:flex; gap:.6rem; margin-top:.4rem; }
  button.btn {
    border:0; border-radius:13px; padding:.85rem 1rem; font-size:.95rem; font-weight:800; cursor:pointer;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  }
  button.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.btn.wide { flex:1; }
  button.btn.small { padding:.55rem .7rem; font-size:.82rem; border-radius:10px; }
  button.btn.ghost { background:transparent; }
  button.btn.danger { color:var(--danger); border-color:var(--danger); }
  button.btn:disabled { opacity:.5; cursor:default; }

  /* bottom sheet */
  .scrim { position:absolute; inset:0; background:rgba(10,15,25,.45); display:none; z-index:20; }
  .scrim.open { display:block; }
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:21;
    background:var(--surface); border-top-left-radius:22px; border-top-right-radius:22px;
    padding:.6rem 1rem 1.3rem; transform:translateY(102%); transition:transform .22s ease;
    max-height:90%; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  .sheet.open { transform:translateY(0); }
  .grip { width:2.6rem; height:.3rem; border-radius:999px; background:var(--border-strong); margin:.2rem auto .7rem; }

  .whowhat { font-weight:800; font-size:1.05rem; }
  .ctx { color:var(--text-dim); font-size:.82rem; margin:.1rem 0 .2rem; }
  .locked { font-size:.68rem; color:var(--nodata); background:var(--nodata-bg); border-radius:6px; padding:.05rem .35rem; margin-left:.3rem; }

  .scorewrap { text-align:center; margin:1rem 0 .4rem; }
  .scoreline { display:flex; align-items:center; justify-content:center; gap:.6rem; }
  .stepbtn {
    width:3.4rem; height:3.4rem; border-radius:16px; border:1px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:1.9rem; font-weight:700; cursor:pointer;
  }
  .stepbtn:active { background:var(--accent-soft); }
  .numin {
    width:4.2rem; height:3.4rem; text-align:center; font-size:2rem; font-weight:800;
    border:1px solid var(--border-strong); border-radius:14px; background:var(--surface); color:var(--text);
  }
  .ofwrap { display:flex; align-items:center; justify-content:center; gap:.4rem; margin-top:.6rem; color:var(--text-dim); font-size:.9rem; }
  .ofin { width:3.2rem; height:2.3rem; text-align:center; font-size:1.1rem; font-weight:800; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); color:var(--text); }
  .pct { font-size:2.6rem; font-weight:900; margin:.5rem 0 .2rem; }
  .pct small { font-size:1rem; color:var(--text-dim); font-weight:700; }

  .more { margin-top:.7rem; border-top:1px solid var(--border); padding-top:.6rem; }
  .moretoggle { background:transparent; border:0; color:var(--accent); font-weight:700; cursor:pointer; padding:.2rem 0; font-size:.86rem; }
  .morebody { display:none; margin-top:.5rem; }
  .morebody.open { display:block; }
  .field { display:flex; align-items:center; justify-content:space-between; padding:.5rem 0; border-bottom:1px dashed var(--border); font-size:.86rem; }
  .field:last-child { border-bottom:0; }
  .field .lab { color:var(--text-dim); }
  .field .val { font-weight:700; }

  /* reason chips */
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0; }
  .rchip {
    border:1.5px solid var(--border-strong); background:var(--surface-2); color:var(--text);
    border-radius:999px; padding:.55rem .9rem; font-size:.9rem; font-weight:700; cursor:pointer;
  }
  .rchip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .req { color:var(--danger); font-size:.8rem; font-weight:700; }

  /* tooltip / why */
  .tip { position:relative; display:inline-flex; }
  .tipbtn { border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); border-radius:999px; width:1.3rem; height:1.3rem; font-size:.75rem; font-weight:800; cursor:pointer; line-height:1; }
  .tipbody { display:none; margin-top:.4rem; background:var(--accent-soft); border:1px solid var(--accent); color:var(--text); border-radius:10px; padding:.5rem .6rem; font-size:.78rem; }
  .tipbody.open { display:block; }

  /* trend chart */
  .chartwrap { width:100%; overflow-x:auto; }
  svg { display:block; }
  .window { display:flex; align-items:center; gap:.35rem; font-size:1.4rem; margin:.2rem 0; }
  .window .wl { font-size:.85rem; color:var(--text-dim); font-weight:700; margin-left:.3rem; }
  .win-yes { color:var(--logged); } .win-no { color:var(--owes); }
  .notyet { font-size:.8rem; color:var(--owes); font-weight:700; }
  .metbox { background:var(--mastery-bg); border:1px solid var(--mastery); border-radius:12px; padding:.7rem; margin:.6rem 0; }
  .metbox .star { font-size:1.2rem; }

  /* tables */
  .tablewrap { width:100%; overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:34rem; font-size:.76rem; }
  th, td { text-align:left; padding:.45rem .55rem; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { background:var(--surface-2); color:var(--text-dim); font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
  tr:last-child td { border-bottom:0; }

  /* planner */
  .segbox { display:flex; align-items:flex-start; gap:.5rem; }
  .toggle2 { display:inline-flex; border:1.5px solid var(--border-strong); border-radius:11px; overflow:hidden; }
  .toggle2 button { border:0; background:var(--surface-2); color:var(--text-dim); font-weight:800; font-size:1rem; padding:.4rem .9rem; cursor:pointer; }
  .toggle2 button.on { background:var(--accent); color:var(--accent-ink); }
  .daysrow { display:flex; gap:.35rem; margin:.3rem 0 .2rem; }
  .day {
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:12px; padding:.45rem .25rem; text-align:center; cursor:pointer; background:var(--surface);
  }
  .day .dn { font-size:.72rem; font-weight:800; color:var(--text-dim); }
  .day .concept { font-size:.6rem; line-height:1.15; margin-top:.2rem; color:var(--text-dim); overflow-wrap:anywhere; }
  .day .dtype { font-size:.58rem; font-weight:800; text-transform:uppercase; letter-spacing:.02em; margin-top:.15rem; color:var(--text-dim); }
  .day .grab { font-size:.75rem; color:var(--text-dim); margin-top:.1rem; }
  /* PLAN day-type colors — TEXT + BORDER only, never a fill (kept distinct from TRACK status hues) */
  .day.core { border-color:var(--plan-core); }
  .day.core .dn, .day.core .dtype, .day.core .concept { color:var(--plan-core); }
  .day.sdi { border-color:var(--plan-sdi); }
  .day.sdi .dn, .day.sdi .dtype { color:var(--plan-sdi); }
  .day.rev { border-color:var(--plan-rev); }
  .day.rev .dn, .day.rev .dtype { color:var(--plan-rev); }
  .day.holiday { opacity:.55; border-style:dashed; border-color:var(--danger); cursor:default; }
  .day.holiday .dn { color:var(--danger); }
  .day.holiday .concept { color:var(--danger); text-decoration:line-through; }
  .day.test { border-color:var(--owes-line); }
  .day.test .dn, .day.test .dtype { color:var(--owes); }

  .braid { background:var(--surface-2); border:1px dashed var(--border-strong); border-radius:12px; padding:.6rem; margin:.5rem 0; }
  .braid .bl { font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin-bottom:.35rem; }
  .braidflow { display:flex; align-items:center; gap:.3rem; flex-wrap:wrap; font-size:.8rem; }
  .bnode { border-radius:8px; padding:.28rem .5rem; font-weight:700; }
  .bnode.unit { background:var(--accent-soft); color:var(--accent); }
  .bnode.std { background:var(--logged-bg); color:var(--logged); }
  .bnode.myp { background:var(--nodata-bg); color:var(--nodata); border:1px dashed var(--border-strong); font-style:italic; }
  .bnode.goals { background:var(--pending-bg); color:var(--pending); }
  .barrow { color:var(--text-dim); font-weight:800; }
  .objective { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--logged); border-radius:10px; padding:.55rem .65rem; margin:.5rem 0; font-size:.85rem; }
  .objective b { color:var(--logged); }

  .checkitem { display:flex; align-items:flex-start; gap:.55rem; padding:.55rem 0; border-bottom:1px solid var(--border); }
  .checkitem:last-child { border-bottom:0; }
  .cmark { font-size:1.25rem; flex:none; }
  .cmark.ok { color:var(--logged); } .cmark.bad { color:var(--danger); } .cmark.warn { color:var(--owes); }
  .cbody { flex:1; }
  .clabel { font-weight:700; font-size:.9rem; }
  .cdetail { font-size:.82rem; color:var(--text-dim); margin-top:.15rem; }
  .glink { color:var(--accent); font-weight:800; cursor:pointer; text-decoration:underline; }

  .ambient { display:flex; gap:.5rem; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.5rem .6rem; margin-bottom:.7rem; align-items:center; }
  .amb { flex:1; text-align:center; font-size:.72rem; font-weight:700; color:var(--text-dim); }
  .amb b { display:block; font-size:1.05rem; }
  .amb.ok b { color:var(--logged); } .amb.warn b { color:var(--owes); }

  .banner { border-radius:12px; padding:.6rem .7rem; margin:.5rem 0; font-size:.85rem; }
  .banner.warn { background:var(--owes-bg); color:var(--owes); border:1px solid var(--owes-line); }
  .banner.info { background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); }
  .banner.ok { background:var(--logged-bg); color:var(--logged); }

  .attach { display:flex; align-items:center; gap:.55rem; padding:.55rem 0; border-bottom:1px dashed var(--border); }
  .attach:last-child { border-bottom:0; }
  .cb { width:1.5rem; height:1.5rem; border:2px solid var(--border-strong); border-radius:6px; flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:900; color:var(--accent-ink); background:var(--surface); }
  .cb.on { background:var(--accent); border-color:var(--accent); }
  .accom { display:inline-block; font-size:.7rem; background:var(--mastery-bg); color:var(--mastery); border-radius:6px; padding:.1rem .4rem; margin-top:.2rem; font-weight:700; }
  .hook { font-size:.75rem; color:var(--pending); background:var(--pending-bg); border-radius:8px; padding:.35rem .5rem; margin-top:.45rem; }

/* ---------------- state ---------------- */

var S = {

     denom:5, probe:'number-line, 5 items', status:'nodata', val:null, reason:'Absent', scorer:'NS', pending:false, freq:'weekly', paraSupported:false},
    {id:'g7', ini:'EF', period:'P4', name:'Rounding', crit:'80% × 4 probes', level:80, n:4,
     denom:5, probe:'rounding, 5 items', status:'mastery', val:84, reason:null, scorer:'NS', pending:false, freq:'weekly', paraSupported:false, acked:false},
    {id:'g8', ini:'JM', period:'P4', name:'Two-step inequalities', crit:'70% × 3 probes', level:70, n:3,
     denom:5, probe:'inequalities, 5 items', status:'incomplete', val:null, reason:null, scorer:'NS', pending:false, freq:'weekly', paraSupported:false, partial:{correct:2, done:3, denom:5}}
  ],

var HISTORY = {

    {admin:'Feb 26', entry:'Feb 26 pm', ct:'4/5', pct:80, probe:'2-step', setting:'Home', scorer:'NS', valid:'—'},

    {admin:'Feb 12', entry:'Feb 12', ct:'4/5', pct:82, probe:'2-step', setting:'Resource', scorer:'JT (para)', valid:'NS 2/12'},

  ],

    {admin:'Feb 19', entry:'Feb 19', ct:'5/5', pct:100, probe:'rounding', setting:'Home', scorer:'NS', valid:'—'},
    {admin:'Feb 12', entry:'Feb 12', ct:'4/5', pct:84, probe:'rounding', setting:'Resource', scorer:'NS', valid:'—'}
  ]
};
/* trend points (admin-date order); nodata = gap, never a plotted 0 */
var TREND = {
  g1:[ {wk:1,v:20,base:true},{wk:2,v:70},{wk:3,v:82},{wk:4,nodata:true},{wk:5,v:82},{wk:6,v:88},{wk:7,v:76} ],
  g7:[ {wk:1,v:60,base:true},{wk:2,v:78},{wk:3,v:84},{wk:4,v:100},{wk:5,v:80},{wk:6,v:100},{wk:7,v:84} ]
};

/* D2: every goal reaches Goal Detail. Goals without hand-authored data get a deterministic
   synthetic history/trend built once, so trend + consistency window + ARC table all render. */
function ensureGoalData(x){
  if(TREND[x.id]) return;
  var dates=['Jan 29','Feb 5','Feb 12','Feb 19','Feb 26','Mar 4'];
  var lvl=x.level, last=(x.val!=null?x.val:lvl+4);
  var seq=[Math.max(10,lvl-45), lvl-20, lvl-5, null, lvl, last];
  var tr=[], hist=[];
  seq.forEach(function(v,i){
    if(v===null){
      tr.push({wk:i+1,nodata:true});
      hist.unshift({admin:dates[i],entry:dates[i],ct:'—',pct:null,probe:x.probe.split(',')[0],setting:'—',scorer:'NS',valid:'—',nodata:'Absent'});
      return;
    }
    v=Math.max(0,Math.min(100,Math.round(v)));
    var corr=Math.max(0,Math.min(x.denom,Math.round(v/100*x.denom)));
    tr.push(i===0?{wk:1,v:v,base:true}:{wk:i+1,v:v});
    hist.unshift({admin:dates[i],entry:dates[i],ct:corr+'/'+x.denom,pct:v,probe:x.probe.split(',')[0],setting:'Resource',scorer:'NS',valid:'—',base:i===0});
  });
  TREND[x.id]=tr; HISTORY[x.id]=hist;
}

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(c,d){ return d>0 ? Math.round((c/d)*100) : 0; }
function glyph(st){ return {owes:'○',logged:'●',nodata:'⊘',mastery:'★',pending:'⏳',incomplete:'◐',queued:'◷'}[st]; }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900); }
/* D1: keep a student's goals adjacent + alphabetized within any group */
function byIni(a,b){ return a.ini<b.ini?-1:(a.ini>b.ini?1:(a.id<b.id?-1:1)); }

/* student identity: fixed color per student, reused on EVERY screen (LOCKED 2026-08-30). */
var STUDENT_HUES=['ab','cd','ef','gh','jm','rt'];
var STUDENT_HUE={ AB:'ab', CD:'cd', EF:'ef', GH:'gh', JM:'jm', RT:'rt' };
function hueClass(ini){
  var i=(''+ini).toUpperCase();
  if(STUDENT_HUE[i]) return STUDENT_HUE[i];
  var s=0; for(var k=0;k<i.length;k++) s=(s*31+i.charCodeAt(k))>>>0;
  return STUDENT_HUES[s%STUDENT_HUES.length];
}
function avatar(ini){ var i=(''+ini).toUpperCase(); return '<span class="av circle '+hueClass(i)+'" role="img" aria-label="student '+esc(i)+'">'+esc(i)+'</span>'; }
function avatarSm(ini){ var i=(''+ini).toUpperCase(); return '<span class="av circle sm '+hueClass(i)+'" role="img" aria-label="student '+esc(i)+'">'+esc(i)+'</span>'; }

function tip(id, text){
  return '<span class="tip"><button class="tipbtn" onclick="toggleTip(\''+id+'\')" aria-label="why">?</button></span>'+
         '<div class="tipbody" id="'+id+'">'+text+'</div>';
}
function toggleTip(id){ var e=$(id); if(e) e.classList.toggle('open'); }

function toggleTheme(){
  var root=document.documentElement;
  var cur=root.getAttribute('data-theme');
  var isDark = cur==='dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light':'dark');
  $('themeBtn').innerHTML = isDark ? '☀' : '☽';
}

function setRole(r){
  S.role=r;
  document.querySelectorAll('#roleSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.role===r); });
  $('tabbar').style.display = r==='para' ? 'none' : 'flex';
  go(r==='para' ? 'para' : 'dashboard');
}

function go(sc){
  S.screen=sc; closeSheet();
  document.querySelectorAll('#tabbar button').forEach(function(b){
    var track=['dashboard','toscore','goalDetail','para','newGoal','baseline'];
    b.classList.toggle('on', (b.dataset.tab==='track') ? track.indexOf(sc)>=0 : ['planWeek','dayEditor','reconcile'].indexOf(sc)>=0);
  });
  render(); $('screen').scrollTop=0;
}

/* ---------------- render router ---------------- */
function render(){
  var el=$('screen');
  var m={ dashboard:renderDashboard, toscore:renderToScore, goalDetail:renderGoalDetail,
          para:renderPara, planWeek:renderPlanWeek, dayEditor:renderDayEditor, reconcile:renderReconcile,
          newGoal:renderNewGoal, baseline:renderBaseline };
  el.innerHTML = (m[S.screen]||renderDashboard)();
}

/* ---- [A] Weekly Dashboard ---- */
function activeGoals(){ return S.goals; }
function renderDashboard(){
  var g=activeGoals();
  var excused=g.filter(x=>x.status==='nodata').length;
  var scored=g.filter(x=>x.status==='logged'||x.status==='mastery').length;
  var pend=g.filter(x=>x.status==='pending').length;
  var queuedN=g.filter(x=>x.status==='queued').length;
  var incompleteN=g.filter(x=>x.status==='incomplete').length;
  var collectable=g.length-excused;
  var owe=collectable-scored-pend-queuedN-incompleteN;

  var h='';
  h+='<div class="headline">';
  h+= '<div class="weeknav"><button onclick="toast(\'prototype: single week\')">‹</button>'+
      '<span class="wk">Week of Mar 3–7</span>'+
      '<button onclick="toast(\'prototype: single week\')">›</button></div>';
  h+= '<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem"><b style="font-size:.82rem">Monitoring this week</b>'+
      tip('tipHeader','Three states, not pass/fail. A documented “no data” is excused — it clears the week honestly and is never counted as a zero.')+'</div>';
  h+= '<div class="three">'+
      '<div class="stat scored"><b>'+scored+'</b><span>scored</span></div>'+
      '<div class="stat excused"><b>'+excused+'</b><span>excused</span></div>'+
      '<div class="stat owe"><b>'+owe+'</b><span>owe</span></div>'+
      '</div>';
  h+= '<div style="font-size:.82rem;color:var(--text-dim)">'+scored+' of '+collectable+' collectable scored'+
      (excused? ' · '+excused+' excused':'')+(owe? ' · '+owe+' owe':'')+'</div>';
  if(pend) h+='<div class="pendnote">⏳ '+pend+' para point'+(pend>1?'s':'')+' awaiting your OK</div>';
  if(queuedN) h+='<div class="pendnote queue">◷ '+queuedN+' collected — to score</div>';
  if(incompleteN) h+='<div class="pendnote hold">◐ '+incompleteN+' incomplete — needs resolution</div>';
  h+='</div>';

  // grouping toggle (O4) — owes-first → by period → by student
  h+='<div style="display:flex;justify-content:flex-end;margin-bottom:.2rem">'+
     '<button class="btn small ghost" onclick="toggleGroup()">Group: '+(S.group==='owes'?'owes-first':S.group==='period'?'by period':'by student')+'</button></div>';

  if(S.group==='owes'){
    var owesL=g.filter(x=>x.status==='owes').sort(byIni);
    var incL=g.filter(x=>x.status==='incomplete').sort(byIni);
    var queuedL=g.filter(x=>x.status==='queued').sort(byIni);
    var pendL=g.filter(x=>x.status==='pending').sort(byIni);
    var doneL=g.filter(x=>['logged','nodata','mastery'].indexOf(x.status)>=0).sort(byIni);
    h+=renderGroupLabel('Owes a point','owes'); owesL.forEach(function(x){ h+=goalRow(x); });
    if(incL.length){ h+=renderGroupLabel('Incomplete — needs resolution','owes'); incL.forEach(function(x){ h+=goalRow(x); }); }
    if(queuedL.length){ h+=renderGroupLabel('Collected — score later','done'); queuedL.forEach(function(x){ h+=goalRow(x); }); }
    h+=renderGroupLabel('Needs your OK','pend');
    if(!pendL.length) h+='<div class="note" style="margin:0 .2rem .5rem">None right now.</div>';
    pendL.forEach(function(x){ h+=validateRow(x); });
    h+=renderGroupLabel('Done this week','done');
    doneL.forEach(function(x){ h+=goalRow(x); });
  } else if(S.group==='period'){
    ['P2','P4'].forEach(function(p){
      h+=renderGroupLabel('Period '+p,'done');
      g.filter(x=>x.period===p).sort(byIni).forEach(function(x){ x.status==='pending'? h+=validateRow(x) : h+=goalRow(x); });
    });
  } else {
    h+=renderByStudent(g);
  }

  h+='<div class="btnrow" style="margin-top:.9rem">'+
     '<button class="btn primary wide" onclick="go(\'newGoal\')">&#43; New goal</button>'+
     '<button class="btn wide" onclick="go(\'toscore\')">To-score ('+S.toScore.length+')</button>'+
     '</div>';
  h+='<button class="btn wide ghost" style="width:100%;margin-top:.5rem" onclick="go(\'baseline\')">Baseline / proposed goals ('+S.proposed.length+')</button>';
  return h;
}
function renderGroupLabel(txt, kind){
  return '<div class="grouplabel '+(kind==='owes'?'owes':'')+'"><span>'+esc(txt)+'</span><span class="ln"></span></div>';
}
function toggleGroup(){ S.group = S.group==='owes'?'period':(S.group==='period'?'student':'owes'); render(); }

/* context action for a goal row: owes/queued → score; incomplete → resolve; scored → history (D3) */
function rowAction(x){
  if(x.status==='owes'||x.status==='queued') return "openScore('"+x.id+"')";
  if(x.status==='incomplete') return "openResolve('"+x.id+"')";
  return "openDetail('"+x.id+"')";
}

/* by-student lens (O4 third option). D1: students owes-first then alphabetical; a student's goals stay nested/adjacent. */
function renderByStudent(g){
  var seen=[];
  g.forEach(function(x){ if(seen.indexOf(x.ini)<0) seen.push(x.ini); });
  var isTodo=function(s){ return s==='owes'||s==='incomplete'||s==='queued'; };
  seen.sort(function(a,b){
    var ao=g.some(x=>x.ini===a&&isTodo(x.status))?0:1;
    var bo=g.some(x=>x.ini===b&&isTodo(x.status))?0:1;
    if(ao!==bo) return ao-bo;
    return a<b?-1:1;
  });
  var h='';
  seen.forEach(function(ini){
    var goals=g.filter(x=>x.ini===ini).sort(byIni);
    var periods=goals.map(x=>x.period).filter(function(v,i,a){return a.indexOf(v)===i;});
    var hue=hueClass(ini);
    var todo=goals.filter(x=>isTodo(x.status)).length;
    h+='<div class="scard">';
    h+='<div class="shead">'+avatar(ini)+'<span class="name">'+esc(ini)+'</span>'+
       '<span class="period">'+esc(periods.join(' / '))+'</span>'+
       (todo? '<span style="margin-left:auto;color:var(--owes);font-weight:800;font-size:.76rem">'+todo+' to do</span>'
            : '<span style="margin-left:auto;color:var(--logged);font-weight:800;font-size:.76rem">✓ done</span>')+
       '</div>';
    goals.forEach(function(x){
      var ctx=rowAction(x);
      var right;
      if(x.status==='owes') right='<span style="color:var(--owes);font-weight:800">owes</span>';
      else if(x.status==='nodata') right='<span style="color:var(--nodata)">⊘ '+esc(x.reason)+'</span>';
      else if(x.status==='pending') right='<span style="color:var(--pending);font-weight:700">⏳ OK?</span>';
      else if(x.status==='mastery') right='<span style="color:var(--mastery);font-weight:800">'+x.val+'% ★</span>';
      else if(x.status==='incomplete') right='<span style="color:var(--owes);font-weight:800">◐ finish</span>';
      else if(x.status==='queued') right='<span style="color:var(--accent);font-weight:800">◷ score</span>';
      else right='<b>'+x.val+'%</b>';
      var actions='';
      if(x.status==='owes') actions+='<button class="minibtn book" title="Gave it — score later" aria-label="Gave it, score later" onclick="bookmark(\''+x.id+'\')">⚑</button>';
      if(['owes','queued','incomplete'].indexOf(x.status)>=0) actions+='<button class="minibtn" title="Trend & history" aria-label="Trend and history" onclick="openDetail(\''+x.id+'\')">↗</button>';
      h+='<div class="sgoal">'+
         '<span class="rail '+hue+'"></span>'+
         '<span class="chip '+x.status+'">'+glyph(x.status)+'</span>'+
         '<span class="g tap" onclick="'+ctx+'">'+esc(x.name)+'</span>'+
         '<span class="tap" onclick="'+ctx+'">'+right+'</span>'+
         (actions?'<span class="rowactions">'+actions+'</span>':'')+
         '</div>';
    });
    h+='</div>';
  });
  return h;
}

function goalRow(x){
  var ctx=rowAction(x);
  // Rows with action buttons (owes/queued/incomplete) fold their value into the meta line,
  // so the right column holds ONLY the buttons — otherwise value + buttons crowd the title.
  var hasActions = (x.status==='owes'||x.status==='queued'||x.status==='incomplete');
  var right='';
  if(x.status==='logged'||x.status==='mastery'){
    right='<div class="rowval">'+x.val+'%</div>'+(x.pending?'<div class="sync">⟳ pending sync</div>':'');
  } else if(x.status==='nodata'){
    right='<div class="rowval dim">no data</div>';
  }
  var meta;
  if(x.status==='nodata') meta = x.period+' · <span style="color:var(--nodata)">reason: '+esc(x.reason)+'</span>';
  else if(x.status==='queued') meta = x.period+' · <span style="color:var(--accent)">collected — to score</span>';
  else if(x.status==='incomplete'){ var pr=x.partial||{}; meta=x.period+' · <span style="color:var(--owes)">partial'+(pr.done?' ('+pr.done+'/'+pr.denom+' done)':'')+'</span>'; }
  else if(x.status==='owes') meta = x.period+' · '+esc(x.probe.split(',')[0])+' · <span style="color:var(--text-dim);font-weight:700">'+esc(x.crit)+'</span>';
  else meta = x.period+' · '+(x.freq!=='weekly'?('<span style="color:var(--pending)">'+x.freq+'</span> · '):'')+esc(x.probe.split(',')[0]);
  var extra='';
  if(x.status==='mastery') extra='<div class="rowmeta" style="color:var(--mastery);font-weight:700">criterion window met — review</div>';
  else if(x.status==='incomplete') extra='<div class="rowmeta" style="color:var(--owes);font-weight:700">◐ incomplete — tap to resolve</div>';
  var rc = x.status==='owes'?'owes':(x.status==='incomplete'?'incomplete':(x.status==='queued'?'queued':''));
  var actions='';
  if(x.status==='owes') actions+='<button class="minibtn book" title="Gave it — score later" aria-label="Gave it, score later" onclick="bookmark(\''+x.id+'\')">⚑</button>';
  if(hasActions) actions+='<button class="minibtn" title="Trend & history" aria-label="Trend and history" onclick="openDetail(\''+x.id+'\')">↗</button>';
  return '<div class="row '+rc+'">'+
    '<span class="chip '+x.status+'">'+glyph(x.status)+'</span>'+
    avatar(x.ini)+
    '<span class="rowmain tap" onclick="'+ctx+'"><span class="rowtitle">'+esc(x.name)+'</span>'+
      '<span class="rowmeta">'+meta+'</span>'+extra+'</span>'+
    (right?'<span class="rowright tap" onclick="'+ctx+'">'+right+'</span>':'')+
    (actions?'<span class="rowactions">'+actions+'</span>':'')+
    '</div>';
}
function validateRow(x){
  var p=x.pending;
  var mm = p.mismatch ? '<span class="mismatch"> · ⚠ total '+p.denom+' vs assigned '+p.expected+'</span>' : '';
  var obs = (p.obs&&p.obs.length)? ' · '+esc(p.obs.join(', ')) : '';
  var setg = p.setting? ' · '+esc(p.setting) : '';
  return '<div class="row validate">'+
    '<span class="chip pending">⏳</span>'+
    avatar(x.ini)+
    '<div class="rowmain"><div class="rowtitle">'+esc(x.name)+'</div>'+
      '<div class="rowmeta">'+x.period+' · '+p.correct+'/'+p.denom+' = '+pct(p.correct,p.denom)+'% · '+esc(p.date||'')+setg+' · JT'+mm+obs+'</div>'+
      (p.mismatch?'<div class="note" style="color:var(--owes)">Total differs from the assigned probe — original-vs-used retained; excluded from the consistency window until you resolve.</div>':'')+
      '<div class="valbtns">'+
        '<button class="btn small primary" onclick="confirmPara(\''+x.id+'\')">Confirm</button>'+
        '<button class="btn small" onclick="openScore(\''+x.id+'\')">Fix</button>'+
      '</div>'+
    '</div></div>';
}
function confirmPara(id){
  var x=S.goals.find(g=>g.id===id); if(!x||!x.pending) return;
  var pnd=x.pending;
  x.status='logged'; x.val=pct(pnd.correct,pnd.denom); x.scorer='JT (para)'; x.validated='NS';
  HISTORY[id]=HISTORY[id]||[];
  var row={admin:pnd.date||'Mar 4', entry:'Mar 4', ct:pnd.correct+'/'+pnd.denom, pct:x.val, probe:x.probe.split(',')[0], setting:pnd.setting||'Resource', scorer:'JT (para)', valid:'NS today'};
  if(pnd.mismatch) row.mismatch=true;
  HISTORY[id].unshift(row);
  x.pending=false;
  toast(pnd.mismatch? 'Confirmed · mismatch kept in audit':'Para point confirmed · now counts');
  render();
}

/* ---- [D6] one-tap bookmark: probe given, score later ---- */
function bookmark(id){
  var x=S.goals.find(g=>g.id===id); if(!x||x.status!=='owes') return;
  x.status='queued';
  if(!S.toScore.some(t=>t.id===id))
    S.toScore.push({id:x.id, ini:x.ini, period:x.period, name:x.name, denom:x.denom, collected:'Mar 4', filled:null});
  toast('Marked given · added to To-score · owe cleared');
  render();
}

/* ---- [B] Quick-Score bottom sheet ---- */
function openScore(id, opts){
  opts=opts||{};
  if(!id){ var owe=S.goals.find(x=>x.status==='owes'); id = owe?owe.id:S.goals[0].id; }
  var x=S.goals.find(g=>g.id===id); if(!x) return;
  var start = (x.pending && x.pending.correct!=null) ? x.pending.correct
            : (x.partial && x.partial.correct!=null ? x.partial.correct : 0);
  var denom = (opts.denom!=null) ? opts.denom : x.denom;
  S.score={ id:id, correct:start, denom:denom, reason:null, mode:'score', moreOpen:!!opts.fromQueue,
            date:opts.date||'Today · Mar 4', setting:'Resource', obs:[], accoms:[],
            queueIdx:(opts.queueIdx!=null?opts.queueIdx:null), collected:opts.collected||null };
  drawSheet();
  openSheet();
}
var PARA_DATES=['Today · Mar 4','Wed · Mar 3','Tue · Mar 2','Mon · Mar 1','Fri · Feb 28'];
var SETTINGS=['Resource','Small group','1:1','Gen-ed'];
/* Para observation menu — LOCKED multi-select (design-decisions §F.F1-update). Fully closed set, no free text (FERPA). */

var ACCOM_TYPES=['Calculator','Multiplication Grid','Worked Example','Manipulatives','Keyword List','Symbol Chart'];
function setScoreDate(d){ S.score.date=d; drawSheet(); }
function setScoreSetting(st){ S.score.setting=st; drawSheet(); }
function toggleObs(o){ var a=S.score.obs; var i=a.indexOf(o); if(i>=0){ a.splice(i,1); if(o==='Accommodation') S.score.accoms=[]; } else a.push(o); drawSheet(); }
function toggleAccom(a){ var arr=S.score.accoms; var i=arr.indexOf(a); if(i>=0)arr.splice(i,1); else arr.push(a); drawSheet(); }

function drawSheet(){
  var s=S.score; var x=S.goals.find(g=>g.id===s.id);
  var isPara = S.role==='para';
  var h='<div class="grip"></div>';

  if(s.mode==='nodata'){
    h+='<div class="whowhat" style="display:flex;align-items:center;gap:.5rem">'+avatar(x.ini)+'<span>'+x.period+' · '+esc(x.name)+'</span></div>';
    h+='<div class="ctx">No data this week</div>';
    h+='<div style="display:flex;align-items:center;gap:.4rem;margin-top:.5rem"><b>Reason</b> <span class="req">required</span>'+
       tip('tipReason','Reason is required so a no-data week is honest. Absent / Testing = excused; “No time” quietly counts toward a fidelity flag before an ARC.')+'</div>';
    var reasons = isPara ? ['Absent','Behavior','No time'] : ['No time','Absent','Testing','Behavior'];
    h+='<div class="chips">'+reasons.map(function(r){
        return '<button class="rchip'+(s.reason===r?' on':'')+'" onclick="pickReason(\''+r+'\')">'+r+'</button>';
      }).join('')+'</div>';
    h+='<div class="btnrow">'+
       '<button class="btn wide" onclick="s_mode(\'score\')">‹ Back</button>'+
       '<button class="btn primary wide" id="ndBtn" onclick="recordNoData()" '+(s.reason?'':'disabled')+'>Record no data</button>'+
       '</div>';
    $('sheet').innerHTML=h; return;
  }

  var p = pct(s.correct, s.denom);
  var mism = (isPara && s.denom!==x.denom);
  h+='<div class="whowhat" style="display:flex;align-items:center;gap:.5rem">'+avatar(x.ini)+'<span>'+x.period+' · '+esc(x.name)+'</span></div>';
  h+='<div class="ctx">Probe: '+esc(x.probe)+' · Setting: '+(isPara?esc(s.setting):'Resource'+'<span class="locked">this session</span>')+'</div>';

  h+='<div class="scorewrap"><div style="font-size:.8rem;color:var(--text-dim);font-weight:700"># CORRECT</div>'+
     '<div class="scoreline">'+
       '<button class="stepbtn" onclick="step(-1)">−</button>'+
       '<input class="numin" id="numin" inputmode="numeric" value="'+s.correct+'" onchange="typeNum(this.value)">'+
       '<button class="stepbtn" onclick="step(1)">+</button>'+
     '</div>'+
     '<div class="ofwrap">of '+
       '<input class="ofin" id="ofin" inputmode="numeric" value="'+s.denom+'" onchange="typeDenom(this.value)">'+
       (mism? '<span class="mismatch">⚠ assigned '+x.denom+'</span>':'')+
     '</div>'+
     '<div class="pct">'+p+'<small>%</small></div>'+
   '</div>';

  h+='<div class="btnrow">'+
     '<button class="btn primary wide" onclick="saveScore()">Save</button>'+
     '<button class="btn wide" onclick="s_mode(\'nodata\')">No data</button>'+
     '</div>';

  if(isPara){
    // F1: para may set a BOUNDED admin date (no future), a SETTING from a picklist, and this probe's TOTAL.
    // Observations are a LOCKED multi-select chip set — no free-text student notes (FERPA hard stop). Everything lands ⏳ pending.
    h+='<div class="more">';
    h+='<label style="margin-top:0">Date administered <span class="locked">today or recent · no future</span></label>';
    h+='<div class="chips">'+PARA_DATES.map(function(d){ return '<button class="dchip'+(s.date===d?' on':'')+'" onclick="setScoreDate(\''+d+'\')">'+d+'</button>'; }).join('')+'</div>';
    h+='<label>Setting</label>';
    h+='<div class="chips">'+SETTINGS.map(function(st){ return '<button class="dchip'+(s.setting===st?' on':'')+'" onclick="setScoreSetting(\''+st+'\')">'+st+'</button>'; }).join('')+'</div>';
    h+='<label>Observations <span style="text-transform:none;font-weight:600">(select all that apply)</span></label>';
    h+='<div class="chips">'+PARA_OBS.map(function(o){ return '<button class="dchip'+(s.obs.indexOf(o)>=0?' on':'')+'" onclick="toggleObs(\''+esc(o)+'\')">'+esc(o)+'</button>'; }).join('')+'</div>';
    if(s.obs.indexOf('Accommodation')>=0){
      h+='<label>Which accommodation(s)?</label>';
      h+='<div class="chips">'+ACCOM_TYPES.map(function(a){ return '<button class="dchip'+(s.accoms.indexOf(a)>=0?' on':'')+'" onclick="toggleAccom(\''+esc(a)+'\')">'+esc(a)+'</button>'; }).join('')+'</div>';
    }
    h+='<div class="note">Tap-select only — no free typing, by design.</div>';
    if(mism) h+='<div class="note" style="color:var(--owes)">Total differs from the assigned probe ('+x.denom+'). It lands flagged for the teacher to resolve; the goal\'s denominator is not changed here.</div>';
    h+='<div class="field"><span class="lab">Student notes</span><span class="val" style="color:var(--nodata)">teacher-only — not on this device</span></div>';
    h+='<div class="field"><span class="lab">Lands as</span><span class="val" style="color:var(--pending)">⏳ pending — teacher confirms</span></div>';
    h+='</div>';
  } else {
    h+='<div class="more"><button class="moretoggle" onclick="toggleMore()">'+(s.moreOpen?'▾':'▸')+' More (date · setting · probe · note)</button>'+
       '<div class="morebody'+(s.moreOpen?' open':'')+'">'+
         '<div class="field"><span class="lab">Date administered</span><span class="val">'+esc(s.date)+' ✎</span></div>'+
         '<div class="field"><span class="lab">Setting</span><span class="val">Resource ✎</span></div>'+
         '<div class="field"><span class="lab">Probe</span><span class="val">'+esc(x.probe)+' ✎</span></div>'+
         '<div class="field"><span class="lab">Note (no names)</span><span class="val" style="color:var(--text-dim)">optional ✎</span></div>'+
         '<button class="btn small ghost" onclick="collectLater()">Collected — score later</button>'+
       '</div></div>';
    h+='<div style="text-align:center;margin-top:.4rem"><button class="moretoggle" style="color:var(--owes)" onclick="saveIncomplete()">Didn\'t finish the probe — save as incomplete</button></div>';
  }
  $('sheet').innerHTML=h;
}
function s_mode(m){ S.score.mode=m; drawSheet(); }
function toggleMore(){ S.score.moreOpen=!S.score.moreOpen; drawSheet(); }
function step(d){ var s=S.score; s.correct=Math.max(0, Math.min(s.denom, s.correct+d)); drawSheet(); }
function typeNum(v){ var s=S.score; var n=parseInt(v,10); if(isNaN(n))n=0; s.correct=Math.max(0,Math.min(s.denom,n)); drawSheet(); }
function typeDenom(v){ var s=S.score; var n=parseInt(v,10); if(isNaN(n)||n<1)n=1; s.denom=n; if(s.correct>n)s.correct=n; drawSheet(); }
function pickReason(r){ S.score.reason=r; drawSheet(); }
function collectLater(){
  var s=S.score; var x=S.goals.find(g=>g.id===s.id);
  if(x && x.status==='owes'){ bookmark(x.id); }
  else toast('Added to To-score · dated today');
  closeSheet();
}

function saveScore(){
  var s=S.score; var x=S.goals.find(g=>g.id===s.id);
  var p=pct(s.correct,s.denom);
  if(S.role==='para'){
    x.status='pending';
    var obsList=s.obs.slice();
    if(s.obs.indexOf('Accommodation')>=0 && s.accoms.length) obsList=obsList.map(function(o){ return o==='Accommodation' ? 'Accommodation ('+s.accoms.join(', ')+')' : o; });
    x.pending={correct:s.correct, denom:s.denom, date:s.date.replace(/^Today · /,''), setting:s.setting, obs:obsList, expected:x.denom, mismatch:(s.denom!==x.denom)};
    toast('Sent for teacher OK · saved offline');
    closeSheet(); render(); return;
  }
  x.status='logged'; x.val=p; x.pending=true; x.scorer='NS'; x.partial=null;
  var admin = s.collected || 'Mar 4';
  HISTORY[x.id]=HISTORY[x.id]||[];
  HISTORY[x.id].unshift({admin:admin, entry:'Mar 4', ct:s.correct+'/'+s.denom, pct:p, probe:x.probe.split(',')[0], setting:s.setting||'Resource', scorer:'NS', valid:'—'});
  if(s.queueIdx!=null){ S.toScore=S.toScore.filter(function(t){return t.id!==s.id;}); }
  toast('Saved '+p+'% · syncs when online');
  closeSheet(); render();
}
function recordNoData(){
  var s=S.score; if(!s.reason) return;
  var x=S.goals.find(g=>g.id===s.id);
  x.status='nodata'; x.reason=s.reason; x.val=null; x.partial=null;
  toast('No data recorded · '+s.reason);
  closeSheet(); render();
}
/* F2: partially administered → holds as "incomplete", no %, not in trend/consistency */
function saveIncomplete(){
  var s=S.score; var x=S.goals.find(g=>g.id===s.id);
  x.status='incomplete'; x.partial={correct:s.correct, done:s.correct, denom:s.denom}; x.val=null;
  toast('Saved as incomplete · needs resolution');
  closeSheet(); render();
}

/* F2 resolve sheet */
function openResolve(id){ S.resolveId=id; drawResolveSheet(); openSheet(); }

/* ---- [E] To-score queue ---- */

  });
  h+='<button class="btn primary wide" style="width:100%;margin-top:.4rem" onclick="saveAllQueue()">Save all</button>';

}
function qStep(i,d){ var t=S.toScore[i]; var c=(t.filled!=null?t.filled:0)+d; t.filled=Math.max(0,Math.min(t.denom,c)); render(); }
function qType(i,v){ var t=S.toScore[i]; var n=parseInt(v,10); if(isNaN(n))n=null; else n=Math.max(0,Math.min(t.denom,n)); t.filled=n; render(); }
function saveAllQueue(){
  var done=0;

function ackMastery(id){ var x=S.goals.find(g=>g.id===id); x.acked=true; toast('Flagged for ARC · goal stays open'); render(); }

/* F4: average of the most-recent-5 SCORED points by admin date; excludes ⊘ but notes them */
function quarterlySummary(x){
  var hist=HISTORY[x.id]||[];
  var scored=hist.filter(function(r){return r.pct!=null;}); // newest-first
  var five=scored.slice(0,5);
  if(!five.length) return '';
  var avg=Math.round(five.reduce(function(a,r){return a+r.pct;},0)/five.length);
  var sv=five.map(function(r){return r.pct;}).slice().sort(function(a,b){return a-b;});
  var median = sv.length%2 ? sv[(sv.length-1)/2] : Math.round((sv[sv.length/2-1]+sv[sv.length/2])/2);
  var newest=five[0].admin, oldest=five[five.length-1].admin;
  var idxN=hist.indexOf(five[0]), idxO=hist.indexOf(five[five.length-1]);
  var span=hist.slice(idxN, idxO+1);
  var nod=span.filter(function(r){return r.nodata;}).length;
  var denoms=five.map(function(r){return (r.ct||'/').split('/')[1];});
  var mixed=denoms.some(function(d){return d!==denoms[0];});
  var use = S.qsMedian? median : avg;
  var h='<div class="qsummary">';
  h+='<div style="display:flex;align-items:center;gap:.4rem"><span class="qlab">Quarterly progress summary</span>'+
     tip('tipQ','A report-card figure: the average of the last '+five.length+' scored points, not the last 5 calendar weeks. Separate from the weekly monitoring points and copied to the progress report (IC), not the weekly feed.')+'</div>';
  h+='<div style="display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0"><span class="big">'+use+'%</span>'+
     '<span style="font-size:.78rem;color:var(--text-dim)">'+(S.qsMedian?'median':'average')+' of last '+five.length+' points · '+oldest+'–'+newest+'</span></div>';
  h+='<div class="chips" style="margin:.2rem 0 .3rem">'+
     '<button class="dchip'+(!S.qsMedian?' on':'')+'" onclick="setQs(false)">Average</button>'+
     '<button class="dchip'+(S.qsMedian?' on':'')+'" onclick="setQs(true)">Median</button></div>';
  if(nod) h+='<div class="note">Spans '+nod+' no-data week'+(nod>1?'s':'')+' (excluded from the average, shown for context).</div>';
  if(five.length<5) h+='<div class="note">Only '+five.length+' scored point'+(five.length>1?'s':'')+' available — averaged as-is, never padded with zeros.</div>';
  if(mixed) h+='<div class="note" style="color:var(--owes)">⚠ Points do not all share the same total — check comparability before reporting.</div>';
  h+='<button class="btn small primary" style="margin-top:.4rem" onclick="toast(\'Copied '+use+'% — paste into Infinite Campus progress report\')">Copy for IC progress report</button>';
  h+='</div>';
  return h;
}
function setQs(m){ S.qsMedian=m; render(); }

function editType(v){ var e=S.edit; var n=parseInt(v,10); if(isNaN(n))n=0; e.correct=Math.max(0,Math.min(e.denom,n)); drawEditSheet(); }

function trendSVG(tr,level){
  var W=520,H=180, padL=34,padR=14,padT=14,padB=26;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  function X(wk){ return padL + (wk-1)/6*plotW; }
  function Y(v){ return padT + (1-v/100)*plotH; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="trend">';
  [0,20,40,60,80,100].forEach(function(v){
    s+='<line x1="'+padL+'" y1="'+Y(v)+'" x2="'+(W-padR)+'" y2="'+Y(v)+'" stroke="var(--border)" stroke-width="1"/>';
    s+='<text x="'+(padL-6)+'" y="'+(Y(v)+4)+'" font-size="10" fill="var(--text-dim)" text-anchor="end">'+v+'</text>';
  });
  s+='<line x1="'+padL+'" y1="'+Y(level)+'" x2="'+(W-padR)+'" y2="'+Y(level)+'" stroke="var(--owes-line)" stroke-width="2" stroke-dasharray="6 5"/>';
  s+='<text x="'+(W-padR)+'" y="'+(Y(level)-5)+'" font-size="10" fill="var(--owes)" text-anchor="end">aim '+level+'%</text>';
  var seg=[], cur=[];
  tr.forEach(function(p){ if(p.nodata){ if(cur.length)seg.push(cur); cur=[]; } else cur.push(p); });
  if(cur.length)seg.push(cur);
  seg.forEach(function(arr){
    if(arr.length<2) return;
    var d='M'+X(arr[0].wk)+' '+Y(arr[0].v);
    for(var i=1;i<arr.length;i++) d+=' L'+X(arr[i].wk)+' '+Y(arr[i].v);
    s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
  });
  tr.forEach(function(p){
    if(p.nodata){
      s+='<text x="'+X(p.wk)+'" y="'+(H-padB+18)+'" font-size="15" fill="var(--nodata)" text-anchor="middle">⊘</text>';
      s+='<line x1="'+X(p.wk)+'" y1="'+padT+'" x2="'+X(p.wk)+'" y2="'+(H-padB)+'" stroke="var(--nodata)" stroke-width="1" stroke-dasharray="2 4" opacity=".6"/>';
    } else {
      var col = p.v>=level?'var(--logged)':'var(--accent)';
      s+='<circle cx="'+X(p.wk)+'" cy="'+Y(p.v)+'" r="5.5" fill="'+col+'"/>';
      if(p.base) s+='<text x="'+X(p.wk)+'" y="'+(Y(p.v)+18)+'" font-size="9" fill="var(--text-dim)" text-anchor="middle">base</text>';
    }
  });
  s+='</svg>';
  return s;
}

/* ---- [F3] Baseline / proposed-goal track (SEGREGATED) ---- */
function renderBaseline(){
  var h='<div class="backrow"><button class="back" onclick="go(\'dashboard\')">‹ Dashboard</button></div>';
  h+='<h1>Baseline / proposed goals</h1>';
  h+='<div class="sub">New IEP goals being baselined before each student\'s annual ARC. Separate from weekly monitoring.'+
     tip('tipBase','Proposed goals never feed Infinite Campus and carry no weekly “owes”. A usable baseline needs ≥3 comparable probes; the value is an estimate, not a trend.')+'</div>';
  h+='<div class="banner info">These never feed IC and have no weekly “owes”. On adoption at ARC they lock a baseline and become active goals.</div>';
  if(!S.proposed.length){ h+='<div class="card">No proposed goals. Use “＋ New goal → Draft a proposed goal”.</div>'; }
  S.proposed.forEach(function(pg){
    var n=pg.points.length, need=Math.max(0,3-n);
    var avg = n? Math.round(pg.points.reduce(function(a,b){return a+b;},0)/n) : null;
    var sv=pg.points.slice().sort(function(a,b){return a-b;});
    var median = n? (sv.length%2? sv[(sv.length-1)/2] : Math.round((sv[sv.length/2-1]+sv[sv.length/2])/2)) : null;
    var use = S.baseMedian? median : avg;
    h+='<div class="bcard">';
    h+='<div class="bhd">'+avatar(pg.ini)+'<div style="min-width:0"><div class="rowtitle">'+esc(pg.name)+'</div>'+
       '<div class="rowmeta">'+pg.period+' · '+esc(pg.behavior)+'</div></div></div>';
    h+='<div class="note" style="margin-top:.5rem"><b>'+n+' of ≥3 collected</b> · window closes '+pg.windowClose+' · ARC '+pg.arc+'</div>';
    h+='<div class="chips" style="margin:.4rem 0">'+pg.points.map(function(v){return '<span class="dchip" style="cursor:default">'+v+'%</span>';}).join('')+
       (n? '':'<span class="note">no points yet</span>')+'</div>';
    if(n>=3){
      h+='<div style="display:flex;align-items:center;gap:.5rem;margin:.3rem 0"><span class="est">'+use+'%</span>'+
         '<span style="font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--pending)">baseline estimate ('+(S.baseMedian?'median':'average')+')</span></div>';
      h+='<div class="chips">'+
         '<button class="dchip'+(!S.baseMedian?' on':'')+'" onclick="setBaseMed(false)">Average</button>'+
         '<button class="dchip'+(S.baseMedian?' on':'')+'" onclick="setBaseMed(true)">Median</button></div>';
      h+='<div class="note">An estimate, not a trend. Locks into the goal only on ARC adoption, when the criterion is finalized.</div>';
      h+='<div class="btnrow"><button class="btn primary small wide" onclick="addBaselinePoint(\''+pg.id+'\')">＋ Add baseline point</button>'+
         '<button class="btn small wide" onclick="toast(\'Adopt at ARC → activates the goal (prototype)\')">Adopt at ARC →</button></div>';
    } else {
      h+='<div class="note" style="color:var(--owes)">Needs '+need+' more comparable probe'+(need>1?'s':'')+' before a usable baseline.</div>';
      h+='<button class="btn primary small wide" style="width:100%;margin-top:.4rem" onclick="addBaselinePoint(\''+pg.id+'\')">＋ Add baseline point</button>';
    }
    h+='</div>';
  });
  h+='<button class="btn primary wide" style="width:100%;margin-top:.3rem" onclick="go(\'newGoal\')">＋ Draft a proposed goal</button>';
  return h;
}
function setBaseMed(m){ S.baseMedian=m; render(); }
function addBaselinePoint(id){
  var pg=S.proposed.find(function(p){return p.id===id;}); if(!pg) return;
  var base = pg.points.length? pg.points[pg.points.length-1] : 30;
  var v=Math.max(0,Math.min(100, base + (Math.random()<.5?5:10)));
  pg.points.push(v);
  toast('Baseline point added · '+v+'%'+(pg.points.length>=3?' · estimate ready':''));
  render();
}

function planSeg(){
  var p=S.plan;

  var seg=planSeg(), cs=seg.concepts||[], ci=S.plan.conceptStart||0;

       '<div class="greyhook">▸ Differentiate this day → down to ~3rd-grade access <span class="locked">later pass</span></div>';
  } else if(d.type==='sdi'){
    h+='<div style="margin:.1rem 0 .3rem"><b style="color:var(--plan-sdi)">Attach goals</b> (your supported students)</div>';
    S.goals.filter(function(x){return ['AB','CD','EF'].indexOf(x.ini)>=0;}).slice(0,3).forEach(function(x,idx){
      var on=idx<2;
      h+='<div class="attach"><div class="cb '+(on?'on':'')+'" onclick="this.classList.toggle(\'on\')">'+(on?'✓':'')+'</div>'+
         avatar(x.ini)+
         '<div style="flex:1"><div style="font-weight:700">'+esc(x.name)+'</div>'+
         '<div class="rowmeta">probe: '+esc(x.probe)+'</div>'+
         '<span class="accom">Accom/mod: extended time · read-aloud</span></div></div>';
    });
    h+='<div class="hook">Monitoring hook: delivering this yields 1 data point → the tracker. Only logs if the probe matches the goal’s behavior + condition + method.</div>';
  } else if(d.type==='rev'){
    h+='<div><b style="color:var(--plan-rev)">Review &amp; Fluency (Fun Friday)</b></div>'+
       '<div class="note">Mix core-concept review games with IEP-goal fluency practice.</div>'+
       '<div style="margin-top:.5rem"><b>Core review</b></div><div class="note">'+esc(seg.topic)+' — game-based review</div>'+
       '<div style="margin-top:.5rem"><b>Goal fluency</b> '+['AB','CD','GH'].map(avatarSm).join('')+'</div>'+
       '<div class="note">short fluency probes can double as this week’s monitoring point.</div>';
  } else {
    h+='<div class="note">'+(d.type==='holiday'?'⛔ No school — from the calendar.':'✎ Testing day — from the calendar. Instruction pauses; monitoring still owes.')+'</div>';
  }
  h+='</div>';
  if(d.type==='core') h+='<div class="banner info">Core maps toward MYP → Toddle. Kept separate from the IEP → IC track.</div>';
  else if(d.type==='sdi') h+='<div class="banner ok">SDI maps toward IEP % → Infinite Campus. The same activity is never counted for both tracks.</div>';
  else if(d.type==='rev') h+='<div class="banner info">Review &amp; Fluency touches both: core review (→ Toddle) and goal fluency (→ IC), each scored on its own track.</div>';
  return h;
}

/* ---- [J] Reconciliation ---- */
function renderReconcile(){
  var g=S.goals, seg=planSeg();
  var oweList=g.filter(x=>x.status==='owes');
  var core=S.plan.days.filter(function(d){return d.type==='core';}).length;
  var noSdi = ['EF'];
  var h='<div class="backrow"><button class="back" onclick="go(\'planWeek\')">‹ Week</button></div>';
  h+='<h1>Reconcile · '+esc(WEEKS[S.plan.weekIdx].label.replace('Week of ',''))+'</h1>';
  h+='<div class="sub">Ambient all week, or open the checklist at close.'+
     tip('tipRecon','The strip fills in as you go so nothing piles up. The checklist is the end-of-week gate — both, so it fits how you actually work.')+'</div>';
  h+=ambientStrip();

  h+='<div class="card">';
  h+='<div class="checkitem"><span class="cmark ok">✓</span><div class="cbody">'+
     '<div class="clabel">(a) Standard exposed?</div>'+
     '<div class="cdetail">'+esc(seg.std&&seg.std.length?seg.std[0]:seg.topic)+' taught on '+core+' core day'+(core===1?'':'s')+'.</div></div></div>';
  h+='<div class="checkitem"><span class="cmark '+(noSdi.length?'bad':'ok')+'">'+(noSdi.length?'✗':'✓')+'</span><div class="cbody">'+
     '<div class="clabel">(b) Each goal given SDI time?</div>'+
     '<div class="cdetail" style="display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-top:.25rem">'+
       ['AB','CD','GH'].map(function(i){return '<span style="display:inline-flex;align-items:center;gap:.25rem">'+avatarSm(i)+'<span style="color:var(--logged)">✓</span></span>';}).join('')+
       (noSdi.length? noSdi.map(function(i){return '<span style="display:inline-flex;align-items:center;gap:.25rem">'+avatarSm(i)+'<span style="color:var(--danger)">✗ no SDI day</span></span>';}).join('')+'<span class="glink" onclick="go(\'dayEditor\')">attach a day</span>':'')+
     '</div></div></div>';
  var ccells = g.map(function(x){
    if(x.status==='owes') return '<span class="glink" style="display:inline-flex;align-items:center;gap:.25rem" onclick="openScore(\''+x.id+'\')">'+avatarSm(x.ini)+'○ owes</span>';
    if(x.status==='nodata') return '<span style="display:inline-flex;align-items:center;gap:.25rem;color:var(--nodata)">'+avatarSm(x.ini)+'⊘ ('+esc(x.reason)+')</span>';
    if(x.status==='pending') return '<span style="display:inline-flex;align-items:center;gap:.25rem;color:var(--pending)">'+avatarSm(x.ini)+'⏳</span>';
    if(x.status==='incomplete') return '<span class="glink" style="display:inline-flex;align-items:center;gap:.25rem;color:var(--owes)" onclick="openResolve(\''+x.id+'\')">'+avatarSm(x.ini)+'◐ incomplete</span>';
    if(x.status==='queued') return '<span style="display:inline-flex;align-items:center;gap:.25rem;color:var(--accent)">'+avatarSm(x.ini)+'◷ to score</span>';
    return '<span style="display:inline-flex;align-items:center;gap:.25rem;color:var(--logged)">'+avatarSm(x.ini)+'●</span>';
  }).join('');
  h+='<div class="checkitem"><span class="cmark '+(oweList.length?'warn':'ok')+'">'+(oweList.length?'!':'✓')+'</span><div class="cbody">'+
     '<div class="clabel">(c) Each active goal has this week’s point?</div>'+
     '<div class="cdetail" style="display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-top:.25rem">'+ccells+'</div>'+
     '<div class="note">⊘ no-data does not read as a zero. Tap an owing goal to score it now.</div></div></div>';
  h+='</div>';

  var status = oweList.length? 'NOT monitoring-complete — '+oweList.length+' goal'+(oweList.length>1?'s':'')+' owe' : 'Monitoring-complete';
  h+='<div class="banner '+(oweList.length?'warn':'ok')+'"><b>Week status:</b> '+status+'</div>';
  h+='<div class="btnrow">'+
     (oweList.length? '<button class="btn primary wide" onclick="openScore(\''+oweList[0].id+'\')"><span style="display:inline-flex;align-items:center;gap:.4rem;justify-content:center">'+avatarSm(oweList[0].ini)+'Fix now</span></button>':'')+
     '<button class="btn wide" onclick="closeWeek()">Close week</button></div>';
  h+='<div class="note">Closing with gaps is allowed — the specific owed goals are recorded durably (weeks-owed counter), never silently marked done.</div>';
  return h;
}
function closeWeek(){
  var owe=S.goals.filter(x=>x.status==='owes').length;
  toast(owe? 'Week closed · '+owe+' gap(s) recorded for ARC':'Week closed · complete');
  go('planWeek');
}

/* Testing-week bulk action (reached from the calendar-driven disruption section, not a manual mode) */
function bulkTesting(){
  var n=0;
  S.goals.forEach(function(x){ if(x.status==='owes'){ x.status='nodata'; x.reason='Testing'; n++; } });
  toast(n+' marked no-data (Testing) · real points kept');
  render();
}

/* ---------------- init ---------------- */
S.plan.segIdx=WEEKS[0].seg; S.plan.conceptStart=WEEKS[0].start||0; buildWeekDays();
render();
</script>
